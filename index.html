       ========================================= */

      width: 100%;

    }

      width: 100%;

      padding: 14px 16px;
      padding-right: 48px;

      outline: none;

      background: #15151d;
      color: #ffffff;

    }

    .search-input::placeholder {
      color: #777782;
    }

    .search-input:focus {
      border-color: #8b7cff;
    }

    .search-icon {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #888894;
      font-size: 18px;

      pointer-events: none;
    }

    /* =========================================
       SECTION TITLE
       ========================================= */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 12px 0;

      font-size: 18px;
      font-weight: 700;
    }

       CATEGORIES
       ========================================= */

      gap: 8px;

       ========================================= */

      gap: 12px;

       APP CARD
       ========================================= */

      align-items: center;
      gap: 12px;

      padding: 13px;

      border-radius: 16px;

/* =========================================================
   HELPER FUNCTIONS
   ========================================================= */

function safeText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function fallbackImage(element) {
  element.onerror = null;
  element.src =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="500"
           height="500"
           viewBox="0 0 500 500">
        <rect width="500" height="500" fill="#17171f"/>
        <text x="50%" y="50%"
              dominant-baseline="middle"
              text-anchor="middle"
              fill="#777"
              font-family="Arial"
              font-size="42">
          HA444
        </text>
      </svg>
    `);
}


/* =========================================================
   CATEGORIES
   ========================================================= */

let selectedCategory = "All";


function renderCategories() {

  const categoriesBox = document.getElementById("categories");

  const categoryList = [
    "All",
    ...new Set(
      apps
        .map(app => app.category)
        .filter(Boolean)
    )
  ];

  categoriesBox.innerHTML = categoryList.map(category => {

    const active =
      category === selectedCategory
        ? "active"
        : "";

    return `
      <button
        class="category-btn ${active}"
        type="button"
        onclick="selectCategory('${safeText(category)}')">
        ${safeText(category)}
      </button>
    `;

  }).join("");
}


function selectCategory(category) {

  selectedCategory = category;

  renderCategories();
  renderApps();
}


/* =========================================================

   ========================================================= */

function renderApps() {

  const grid = document.getElementById("appGrid");
  const searchInput = document.getElementById("searchInput");

  const searchText =
    searchInput.value.trim().toLowerCase();

  const filteredApps = apps.filter(app => {

    const matchesCategory =
      selectedCategory === "All" ||
      app.category === selectedCategory;

    const searchableText = `
      ${app.name || ""}
      ${app.description || ""}
      ${app.category || ""}
      ${app.version || ""}
    `.toLowerCase();

    const matchesSearch =
      searchableText.includes(searchText);

    return matchesCategory && matchesSearch;
  });


  document.getElementById("appCount").textContent =
    `${filteredApps.length} Apps`;


  if (filteredApps.length === 0) {

    grid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:50px 20px;
        color:#777782;
      ">
        <div style="font-size:45px;margin-bottom:12px;">
          🔍
        </div>

        <div style="
          color:#fff;
          font-size:17px;
          font-weight:bold;
          margin-bottom:7px;
        ">
          No Apps Found
        </div>

        <div style="font-size:13px;">
          Try another search or category.
        </div>
      </div>
    `;

    return;
  }


  grid.innerHTML = filteredApps.map((app, index) => {

    const image =
      app.image ||
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="500"
             height="500">
          <rect width="500" height="500" fill="#17171f"/>
          <text x="50%" y="50%"
                dominant-baseline="middle"
                text-anchor="middle"
                fill="#777"
                font-family="Arial"
                font-size="42">
            HA444
          </text>
        </svg>
      `);


    return `
      <article class="app-card">

        <img
          class="app-icon"
          src="${safeText(image)}"
          alt="${safeText(app.name)}"
          onerror="fallbackImage(this)"
        >

        <div class="app-info">

          <h3 class="app-name">
            ${safeText(app.name || "Unnamed App")}
          </h3>

          <div class="app-meta">
            <span>
              ${safeText(app.category || "Other")}
            </span>

            <span>•</span>

            <span>
              ${safeText(app.version || "Unknown")}
            </span>
          </div>

          <button
            class="view-btn"
            type="button"
            onclick="openDetails(${index})">
            View App
          </button>

        </div>

      </article>
    `;

  }).join("");
}


/* =========================================================
   OPEN APP DETAILS
   ========================================================= */

function openDetails(index) {

  const app = apps[index];

  if (!app) return;


  const detailsContent =
    document.getElementById("detailsContent");

  const template =
    document.getElementById("appDetailsTemplate");


  detailsContent.innerHTML =
    template.innerHTML;


  const icon =
    document.getElementById("detailsIcon");

  const name =
    document.getElementById("detailsName");

  const category =
    document.getElementById("detailsCategory");

  const version =
    document.getElementById("detailsVersion");

  const size =
    document.getElementById("detailsSize");

  const description =
    document.getElementById("detailsDescription");

  const download =
    document.getElementById("detailsDownload");


  icon.src =
    app.image || "";

  icon.alt =
    app.name || "App";

  icon.onerror =
    function() {
      fallbackImage(this);
    };


  name.textContent =
    app.name || "Unnamed App";

  category.textContent =
    app.category || "Other";

  version.textContent =
    app.version || "Unknown";

  size.textContent =
    app.size || "Unknown";

  description.textContent =
    app.description ||
    "No description available.";


  if (
    app.download &&
    app.download !== "YOUR_GOOGLE_DRIVE_LINK"
  ) {

    download.href = app.download;

    download.target = "_blank";

    download.rel =
      "noopener noreferrer";

    download.textContent =
      "Download APK";

    download.style.pointerEvents =
      "auto";

    download.style.opacity =
      "1";

  } else {

    download.removeAttribute("href");

    download.removeAttribute("target");

    download.textContent =
      "Download Unavailable";

    download.style.pointerEvents =
      "none";

    download.style.opacity =
      "0.45";
  }


  showScreen("detailsScreen");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   SCREEN SYSTEM
   ========================================================= */

function showScreen(screenId) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove("active");

    });


  const target =
    document.getElementById(screenId);

  if (target) {

    target.classList.add("active");

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================================================
   LOADING SCREEN
   ========================================================= */

window.addEventListener("load", function() {

  setTimeout(function() {

    const loading =
      document.getElementById("loadingScreen");

    if (loading) {

      loading.style.opacity = "0";

      loading.style.transition =
        "opacity 0.3s ease";

      setTimeout(function() {

        loading.style.display = "none";

      }, 300);

    }

  }, 600);

});
