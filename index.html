<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b0f"
  >

  <meta
    name="description"
    content="HA444 - HackerAPKs444"
  >

  <title>HA444 - HackerAPKs444</title>


  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }


    button,
    input {
      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      background: #101016;

      border-bottom: 1px solid #22222c;

      position: sticky;
      top: 0;
      z-index: 1000;
    }


    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }


    .logo span {
      color: #7777ff;
    }


    .header-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .header-btn {
      width: 42px;
      height: 42px;

      border: 1px solid #292934;
      border-radius: 12px;

      background: #17171f;
      color: #ffffff;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .header-btn:active {
      transform: scale(0.96);
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .container {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      padding: 20px 15px 40px;
    }


    /* =====================================================
       SCREEN SYSTEM
       ===================================================== */

    .screen {
      display: none;
      animation: screenIn 0.25s ease;
    }


    .screen.active {
      display: block;
    }


    @keyframes screenIn {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =====================================================
       HERO
       ===================================================== */

    .hero {
      padding: 18px 0 20px;
    }


    .hero h1 {
      font-size: 28px;
      font-weight: 900;

      margin-bottom: 7px;
    }


    .hero p {
      color: #8b8b98;
      font-size: 14px;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }


    .search-input {
      width: 100%;

      height: 50px;

      padding: 0 48px 0 16px;

      border: 1px solid #292934;
      border-radius: 14px;

      outline: none;

      background: #15151c;
      color: #ffffff;

      font-size: 15px;
    }


    .search-input::placeholder {
      color: #686873;
    }


    .search-input:focus {
      border-color: #5555ff;
    }


    .search-icon {
      position: absolute;

      right: 16px;
      top: 50%;

      transform: translateY(-50%);

      color: #777782;

      font-size: 18px;
    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    .categories {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding-bottom: 5px;

      margin-bottom: 20px;

      scrollbar-width: none;
    }


    .categories::-webkit-scrollbar {
      display: none;
    }


    .category-btn {
      flex: 0 0 auto;

      border: 1px solid #292934;

      background: #15151c;
      color: #a4a4af;

      border-radius: 20px;

      padding: 9px 15px;

      font-size: 13px;

      transition: 0.2s;
    }


    .category-btn.active {
      background: #ffffff;
      color: #0b0b0f;
      border-color: #ffffff;
    }


    /* =====================================================
       SECTION TITLE
       ===================================================== */

    .section-title {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;

      font-size: 18px;
      font-weight: 800;
    }


    /* =====================================================
       APP GRID
       ===================================================== */

    .app-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;
    }


    /* =====================================================
       APP CARD
       ===================================================== */

    .app-card {
      background: #14141b;

      border: 1px solid #252530;

      border-radius: 17px;

      padding: 12px;

      overflow: hidden;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }


    .app-card:active {
      transform: scale(0.98);
    }


    .app-icon {
      width: 100%;
      aspect-ratio: 1 / 1;

      display: block;

      object-fit: cover;

      border-radius: 14px;

      background: #1d1d25;

      margin-bottom: 11px;
    }


    .app-name {
      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      margin-bottom: 5px;
    }


    .app-meta {
      display: flex;
      gap: 5px;

      color: #777782;

      font-size: 11px;

      margin-bottom: 11px;

      white-space: nowrap;
      overflow: hidden;
    }


    .view-btn {
      width: 100%;

      height: 38px;

      border: 0;
      border-radius: 10px;

      background: #ffffff;
      color: #0b0b0f;

      font-size: 12px;
      font-weight: 800;
    }


    /* =====================================================
       BACK BUTTON
       ===================================================== */

    .back-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 42px;

      padding: 0 15px;

      margin-bottom: 17px;

      border: 1px solid #292934;
      border-radius: 12px;

      background: #17171f;
      color: #ffffff;

      font-size: 14px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      text-align: center;

      color: #5f5f69;

      font-size: 12px;

      margin-top: 35px;

      padding-top: 20px;

      border-top: 1px solid #20202a;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (min-width: 700px) {

      .app-grid {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }

      .container {
        padding-left: 22px;
        padding-right: 22px;
      }

    }


  </style>

</head>

function safeText(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* =========================================================

   ========================================================= */

function fallbackImage(element) {

  element.onerror = null;

  element.src =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"

  const grid =

  const searchInput =

  const searchText =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredApps =

      const matchesCategory =
        selectedCategory === "All" ||
        app.category === selectedCategory;


      const searchableText = `
        ${app.name || ""}
        ${app.description || ""}
        ${app.category || ""}
        ${app.version || ""}
      `.toLowerCase();


      const matchesSearch =
        searchableText.includes(searchText);


      return (
        matchesCategory &&
        matchesSearch
      );

    });



  /* APP COUNT */

  document.getElementById("appCount")
    .textContent =
      `${filteredApps.length} Apps`;

  grid.innerHTML =
    filteredApps.map(app => {

      return `

              <span>

              class="view-btn"
              type="button"
              onclick="openDetails(${originalIndex})"
            >

/* =========================================================

function openDetails(index) {

  const app =

  if (!app) {
    return;
  }


  const detailsContent =
    document.getElementById(
      "detailsContent"
    );


  const template =
    document.getElementById(
      "appDetailsTemplate"
    );


  detailsContent.innerHTML =
    template.innerHTML;



  /* APP IMAGE */

  const icon =
    document.getElementById(
      "detailsIcon"
    );


  icon.src =
    app.image || "";


  icon.alt =
    app.name || "App";


  icon.onerror =
    function() {

      fallbackImage(this);

    };



  /* APP NAME */

  document.getElementById(
    "detailsName"
  ).textContent =
    app.name ||
    "Unnamed App";



  /* CATEGORY */

  document.getElementById(
    "detailsCategory"
  ).textContent =
    app.category ||
    "Other";



  /* VERSION */

  document.getElementById(
    "detailsVersion"
  ).textContent =
    app.version ||
    "Unknown";



  /* SIZE */

  document.getElementById(
    "detailsSize"
  ).textContent =
    app.size ||
    "Unknown";



  /* DESCRIPTION */

  document.getElementById(
    "detailsDescription"
  ).textContent =
    app.description ||
    "No description available.";



  /* DOWNLOAD */

  const download =
    document.getElementById(
      "detailsDownload"
    );


  if (
    app.download &&
    app.download !==
      "YOUR_GOOGLE_DRIVE_APK_LINK"
  ) {

    download.href =
      app.download;

    download.target =
      "_blank";

    download.rel =
      "noopener noreferrer";

    download.textContent =
      "Download APK";

    download.style.pointerEvents =
      "auto";

    download.style.opacity =
      "1";

  }

  else {

    download.removeAttribute(
      "href"
    );

    download.removeAttribute(
      "target"
    );

    download.textContent =
      "Download Unavailable";

    download.style.pointerEvents =
      "none";

    download.style.opacity =
      "0.45";

  }



  /* OPEN DETAILS */

  showScreen(
    "detailsScreen"
  );


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* =========================================================
   SCREEN NAVIGATION
   ========================================================= */

function showScreen(screenId) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove(
        "active"
      );

    });


  const target =
    document.getElementById(
      screenId
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}
